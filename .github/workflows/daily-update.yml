name: Daily arXiv Update

on:
  # 每天北京时间 9:00 运行 (UTC 1:00)
  schedule:
    - cron: '0 1 * * *'

  # 允许手动触发
  workflow_dispatch:

# 设置权限
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 设置 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 创建 .env 文件
      - name: Create .env file
        run: |
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
          echo "OPENAI_BASE_URL=${{ secrets.OPENAI_BASE_URL }}" >> .env
          echo "ZOTERO_USER_ID=${{ secrets.ZOTERO_USER_ID }}" >> .env
          echo "ZOTERO_API_KEY=${{ secrets.ZOTERO_API_KEY }}" >> .env

      # 等待一段时间避免 arXiv API 限流
      - name: Wait before fetching
        run: sleep 30

      # 运行主程序获取论文
      - name: Run daily update
        run: python main.py

      # 生成静态网页
      - name: Generate static page
        run: python generate_static.py

      # 提交数据和网页到仓库
      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 提交数据和 docs 目录
          git add data/papers/ data/summaries/ docs/

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            DATE=$(date +%Y-%m-%d)
            git commit -m "Daily update: ${DATE}"
            git push
          fi

      # 部署到 GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4